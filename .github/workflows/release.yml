name: Release

# Push a tag v<version> matching package.json; the zip goes to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - run: npm test
      - run: npm run build
      - name: Zip
        run: cd dist && zip -r "../ReimaginedLC-${GITHUB_REF_NAME#v}.zip" ReimaginedLC
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" "ReimaginedLC-${GITHUB_REF_NAME#v}.zip" --generate-notes $flags
